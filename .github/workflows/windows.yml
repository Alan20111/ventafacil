name: Verificar en Windows
on:
  workflow_dispatch:
  push:
    branches: [ 'verificar/**' ]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Pruebas de datos con .NET Framework y SQLite real
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build herramientas/pruebas-datos-windows -c Release -nologo -v q -o salida-datos
          ./salida-datos/PruebasDatosWindows.exe 2>&1 | Tee-Object datos.txt
      - name: Compilar el verificador de pantallas
        shell: pwsh
        run: dotnet build herramientas/verificar-ui -c Release -nologo -v q -o salida-ui
      - name: Abrir todas las pantallas
        continue-on-error: true
        shell: pwsh
        run: |
          try { Set-DisplayResolution -Width 1600 -Height 900 -Force } catch { Write-Host $_ }
          (New-Object -ComObject Shell.Application).MinimizeAll()
          Start-Sleep 2
          ./salida-ui/VerificarUi.exe capturas 2>&1 | Out-File ui.txt
          Get-Content ui.txt -TotalCount 400
      - name: Abrir el programa de verdad (instalacion nueva)
        continue-on-error: true
        shell: pwsh
        run: |
          dotnet build src/VentaFacil -c Release -nologo -v q -o salida-exe
          New-Item -ItemType Directory -Force suelto | Out-Null
          Copy-Item salida-exe/VentaFacil.exe suelto/
          Remove-Item C:\VentaFacil -Recurse -Force -ErrorAction SilentlyContinue
          Start-Process suelto/VentaFacil.exe
          Start-Sleep 15
          $p = Get-Process VentaFacil -ErrorAction SilentlyContinue
          "Proceso: $($p.Path)  Ventana: [$($p.MainWindowTitle)]" | Tee-Object arranque.txt
          "Carpeta: " + ((Get-ChildItem C:\VentaFacil -Recurse -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName) -join '; ') | Tee-Object -Append arranque.txt
          "Asociacion: " + (Get-ItemProperty 'HKCU:\Software\Classes\VentaFacil.Archivo\shell\open\command' -ErrorAction SilentlyContinue).'(default)' | Tee-Object -Append arranque.txt
          "Errores: " + (Get-Content C:\VentaFacil\datos\errores.log -Raw -ErrorAction SilentlyContinue) | Tee-Object -Append arranque.txt
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $r = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $b = New-Object System.Drawing.Bitmap $r.Width, $r.Height
          [System.Drawing.Graphics]::FromImage($b).CopyFromScreen(0, 0, 0, 0, $b.Size)
          New-Item -ItemType Directory -Force capturas | Out-Null
          $b.Save("$pwd\capturas\00 arranque real.png")
          # Como una persona: dejar el asistente, entrar, abrir turno y salir con Alt+F4
          function Foto($n) { $x = New-Object System.Drawing.Bitmap $r.Width, $r.Height; [System.Drawing.Graphics]::FromImage($x).CopyFromScreen(0, 0, 0, 0, $x.Size); $x.Save("$pwd\capturas\00 $n.png") }
          $w = New-Object -ComObject WScript.Shell
          function Teclas($t, $s) { $w.SendKeys($t); Start-Sleep $s }
          $w.AppActivate((Get-Process VentaFacil).Id) | Out-Null; Start-Sleep 1
          Teclas '{ESC}' 2; Foto 'a confirma'; Teclas 'y' 3; Foto 'b login'
          Teclas 'admin{ENTER}' 2; Foto 'b login 2'; Teclas 'admin{ENTER}' 4; Foto 'c fondo'
          Teclas '{ENTER}' 5; Foto 'd caja'
          $antes = (Get-ChildItem C:\VentaFacil\datos\respaldos\ventafacil_*.db).Count
          Teclas '%{F4}' 2; Foto 'e salir'
          Teclas '{TAB}{ENTER}' 0; Start-Sleep -Milliseconds 700; Foto 'f respaldando'
          Start-Sleep 6
          $vivo = Get-Process VentaFacil -ErrorAction SilentlyContinue
          $ahora = (Get-ChildItem C:\VentaFacil\datos\respaldos\ventafacil_*.db).Count
          "Cierre: respaldos $antes -> $ahora   sigue abierto: $([bool]$vivo)" | Tee-Object -Append arranque.txt
          "Copias: " + ((Get-ChildItem "$([Environment]::GetFolderPath('Desktop'))\VentaFacil_Respaldos" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name) -join '; ') | Tee-Object -Append arranque.txt
          "Errores al final: " + (Get-Content C:\VentaFacil\datos\errores.log -Raw -ErrorAction SilentlyContinue) | Tee-Object -Append arranque.txt
          Foto 'g final'
          Stop-Process -Name VentaFacil -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas
          path: |
            capturas
            datos.txt
            ui.txt
            arranque.txt
          retention-days: 3
